name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: skill 格式校验（DSH 兼容）
        run: uv run kaoyan-skill-lint ../.agents/skills

  sync-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-server
    steps:
      - uses: actions/checkout@v4
      - name: 若目录尚未创建则跳过
        id: check
        run: |
          if [ -f package.json ] || [ -f pyproject.toml ]; then echo "exists=1" >> "$GITHUB_OUTPUT"; else echo "exists=0" >> "$GITHUB_OUTPUT"; fi
      - uses: astral-sh/setup-uv@v6
        if: steps.check.outputs.exists == '1'
      - run: uv sync
        if: steps.check.outputs.exists == '1'
      - run: uv run pytest -q
        if: steps.check.outputs.exists == '1'

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: 若目录尚未创建则跳过
        id: check
        run: |
          if [ -f package.json ]; then echo "exists=1" >> "$GITHUB_OUTPUT"; else echo "exists=0" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == '1'
        with:
          node-version: 22
      - run: npm install
        if: steps.check.outputs.exists == '1'
      - run: npm run typecheck
        if: steps.check.outputs.exists == '1'
      - run: npm run build:renderer
        if: steps.check.outputs.exists == '1'

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: 若目录尚未创建则跳过
        id: check
        run: |
          if [ -f package.json ]; then echo "exists=1" >> "$GITHUB_OUTPUT"; else echo "exists=0" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == '1'
        with:
          node-version: 22
      - run: npm install
        if: steps.check.outputs.exists == '1'
      - run: npm run typecheck
        if: steps.check.outputs.exists == '1'
