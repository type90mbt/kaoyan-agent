[project]
name = "kaoyan-engine"
version = "0.1.0"
description = "Kaoyan Agent 本地引擎：模型网关、课件检索、harness、DSH 兼容 skill、电脑操作工具与学习数据"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "keyring>=25",
    "watchfiles>=0.22",
    "fsrs>=5.0",
    "mcp>=1.2",
]

[project.scripts]
kaoyan-engine = "kaoyan_engine.main:run"
kaoyan-skill-lint = "kaoyan_engine.skills.lint:main"
kaoyan-eval = "kaoyan_engine.evals.runner:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kaoyan_engine"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
